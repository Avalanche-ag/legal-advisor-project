services:
  - type: web
    name: ai-lawyer-ipc
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app --workers 1 --threads 4 --timeout 120 --max-requests 500 --max-requests-jitter 50"
    preDeployCommand: "python scripts/build_index.py --format numpy && python scripts/init_db.py"
    envVars:
      # Pin the interpreter: scipy/torch need wheels that exist for 3.12.
      # Without this, Render may pick 3.13+ and pip falls back to building
      # scipy from source, which fails ("error while generating package metadata").
      - key: PYTHON_VERSION
        value: "3.12.7"

      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

      # --- runtime profile ---
      - key: VECTOR_BACKEND
        value: numpy
      - key: EMBEDDING_BACKEND
        value: hf
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"

      # --- MySQL (Aiven / TiDB Cloud free tiers) ---
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: ipc_app

      # --- initial admin ---
      - key: ADMIN_EMAIL
        value: admin@local.dev
      - key: ADMIN_PASSWORD
        sync: false
      - key: PORT
        value: 10000
