<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Legal Advisor — IPC Assistant{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9878;&#65039;</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">
      <i class="fa-solid fa-scale-balanced"></i> Legal Advisor
    </a>
    <div class="nav-links">
      {% if current_user.is_authenticated %}
        <button type="button" id="history-toggle" class="nav-btn">
          <i class="fa-solid fa-clock-rotate-left"></i> My History
        </button>
        {% if current_user.role == 'admin' %}
          <a href="{{ url_for('admin.dashboard') }}" class="nav-btn"><i class="fa-solid fa-shield-halved"></i> Admin</a>
        {% endif %}
        <span class="user-chip">{{ current_user.username }} <em>({{ current_user.role }})</em></span>
        <a href="{{ url_for('auth.logout') }}" class="nav-btn">Logout</a>
      {% else %}
        <a href="{{ url_for('auth.login_page') }}" class="nav-btn">Login</a>
        <a href="{{ url_for('auth.register_page') }}" class="nav-btn primary">Register</a>
      {% endif %}
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
